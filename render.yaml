# Render Blueprint — https://render.com/docs/infrastructure-as-code
# Deploys the Express API (`@workspace/api-server`) with Postgres.

databases:
  - name: ai-guide-postgres
    plan: basic-256mb
    databaseName: ai_guide

services:
  - type: web
    name: ai-guide-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-guide-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
